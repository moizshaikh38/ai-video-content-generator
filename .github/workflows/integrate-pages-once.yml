name: Integrate reviewed public pages once
on:
  push:
    branches: [instinct-backup]
    paths: [.github/workflows/integrate-pages-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.ref == 'refs/heads/instinct-backup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instinct-backup
