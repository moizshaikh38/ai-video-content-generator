      - name: Commit integrated source only to backup preview branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Integrate public pages, captured Learning lessons and compact notice'
          git push origin HEAD:instinct-backup
